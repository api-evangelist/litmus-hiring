name: Litmus Hiring
description: >-
  Litmus is a Y Combinator-backed technical hiring platform that turns
  repositories, engineering tickets, and job descriptions into structured,
  project-based technical assessments and interview pipelines tailored to how a
  team actually ships. It evaluates candidates on both code quality and
  development process, lets them work in their own IDE or terminal, and captures
  AI-tool usage (Claude Code, Copilot CLI) transparently. Candidate management
  syncs with the Ashby, Greenhouse, and Lever applicant-tracking systems. Litmus
  exposes a bearer-key REST API (roles, invites, submissions) and an official
  hosted Model Context Protocol (MCP) server for agent-driven access to
  submissions, candidates, pipeline status, and assessment authoring.
